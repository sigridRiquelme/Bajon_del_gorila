<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos | El Bajón del Gorila</title>

    <link rel="stylesheet" href="admin.css">
</head>


<body>

    <div class="admin-container">


        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="logo-admin">

                <img
                    src="../img/logo-bajon.png"
                    alt="El Bajón del Gorila"
                >

            </div>


            <div class="admin-label">
                PANEL DE ADMIN
            </div>


            <nav class="menu-admin">

                <a href="admin.html">
                    Productos
                </a>

                <a href="pedidos.html" class="active">
                    Pedidos
                </a>

                <a href="usuarios.html">
                    Usuarios
                </a>

            </nav>


            <div class="admin-info">

                <strong>Administrador</strong>

                <span>
                    admin@gorila.cl
                </span>

                <a href="#" class="volver-sitio">
                    Volver al sitio
                </a>

            </div>

        </aside>



        <!-- CONTENIDO PRINCIPAL -->
        <main class="contenido-admin">


            <!-- ENCABEZADO -->
            <header class="encabezado-productos">

                <div>

                    <h1>PEDIDOS</h1>

                    <p id="contadorPedidos">
                        0 pedidos
                    </p>

                </div>

            </header>



            <!-- FILTROS -->
            <section class="filtros-productos">

                <input
                    type="text"
                    id="buscarPedido"
                    placeholder="Buscar por cliente o número de pedido..."
                >


                <select id="filtroEstadoPedido">

                    <option value="todos">
                        Todos los pedidos
                    </option>

                    <option value="pendiente">
                        Pendiente
                    </option>

                    <option value="preparando">
                        Preparando
                    </option>

                    <option value="listo">
                        Listo
                    </option>

                    <option value="entregado">
                        Entregado
                    </option>

                    <option value="cancelado">
                        Cancelado
                    </option>

                </select>

            </section>



            <!-- TABLA DE PEDIDOS -->
            <section class="tabla-productos">

                <table>

                    <thead>

                        <tr>
                            <th>PEDIDO</th>
                            <th>CLIENTE</th>
                            <th>FECHA</th>
                            <th>PRODUCTOS</th>
                            <th>TOTAL</th>
                            <th>ESTADO</th>
                        </tr>

                    </thead>


                    <tbody id="listaPedidos">

                    </tbody>

                </table>

            </section>


        </main>

    </div>


    <script src="pedidos.js"></script>

</body>

</html>
