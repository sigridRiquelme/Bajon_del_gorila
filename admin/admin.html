<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administración | El Bajón del Gorila</title>
    
    <link rel="stylesheet" href="admin.css"> 
</head>


<body>

    <div class="admin-container">


        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="logo-admin">

                <img src="../img/logo-bajon.png" alt="El Bajón del Gorila">

            </div>


            <div class="admin-label">
                PANEL DE ADMIN
            </div>


            <nav class="menu-admin">

                <a href="#" class="active">
                    Productos
                </a>

                <a href="#">
                    Pedidos
                </a>

            </nav>


            <div class="admin-info">

                <strong>Administrador</strong>

                <span>admin@gorila.cl</span>

                <a href="#" class="volver-sitio">
                    Volver al sitio
                </a>

            </div>

        </aside>



        <!-- CONTENIDO PRINCIPAL -->
        <main class="contenido-admin">

            <header class="encabezado-productos">

                <div>
                    <h1>PRODUCTOS</h1>
                    <p>1 de 1 productos</p>
                </div>


                <button class="btn-agregar">
                    + AGREGAR PRODUCTO
                </button>

            </header>
            
            <section class="filtros-productos">

                <input
                    type="text"
                    id="buscarProducto"
                    placeholder="Buscar por nombre..."
                >

                <select id="filtroCategoria">

                    <option value="todas">Todas las categorías</option>
                    <option value="hamburguesas">Hamburguesas</option>
                    <option value="completos">Completos</option>
                    <option value="churrascos">Churrascos</option>
                    <option value="papas">Papas</option>
                    <option value="combos">Combos</option>
                    <option value="bebidas">Bebidas</option>
                    <option value="otros">Otros</option>

                </select>

            </section>

            <section class="tabla-productos">

                <table>

                    <thead>

                        <tr>
                            <th>IMAGEN</th>
                            <th>NOMBRE</th>
                            <th>CATEGORÍA</th>
                            <th>PRECIO</th>
                            <th>STOCK</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>

                    </thead>

                    <tbody>
                        <tr>

                            <td>
                                <img
                                    src="../img/gorila-burger.png"
                                    alt="Hamburguesa gorila"
                                    class="imagen-producto"
                                >
                            </td>

                            <td>
                                <strong>Hamburguesa gorila</strong>
                            </td>

                            <td>
                                Hamburguesas
                            </td>

                            <td class="precio">
                                $8.990
                            </td>

                            <td>
                                <span class="stock-disponible">15</span>
                                <span class="unidad-stock">un.</span>
                            </td>

                            <td>
                                <select class="estado-producto disponible">
                                    <option>Disponible</option>
                                    <option>Sin stock</option>
                                    <option>Oculto</option>
                                </select>
                            </td>

                            <td class="acciones">

                                <button class="btn-editar">
                                    EDITAR
                                </button>

                                <button class="btn-eliminar">
                                    ELIMINAR
                                </button>

                            </td>

                        </tr>
                    </tbody>

                </table>

            </section>

        </main>


    </div>


    <script src="admin.js"></script>

</body>

</html>
