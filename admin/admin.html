<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administración | El Bajón del Gorila</title>
    
    <link rel="stylesheet" href="admin.css"> 
</head>


<body>

    <div class="admin-container">


        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="logo-admin">

                <img src="../img/logo-bajon.png" alt="El Bajón del Gorila">

            </div>


            <div class="admin-label">
                PANEL DE ADMIN
            </div>


            <nav class="menu-admin">

                <a href="#" class="active">
                    Productos
                </a>

                <a href="#">
                    Pedidos
                </a>

            </nav>


            <div class="admin-info">

                <strong>Administrador</strong>

                <span>admin@gorila.cl</span>

                <a href="#" class="volver-sitio">
                    Volver al sitio
                </a>

            </div>

        </aside>



        <!-- CONTENIDO PRINCIPAL -->
        <main class="contenido-admin">

            <header class="encabezado-productos">

                <div>
                    <h1>PRODUCTOS</h1>
                    <p>8 de 8 productos</p>
                </div>


                <button class="btn-agregar">
                    + AGREGAR PRODUCTO
                </button>

            </header>

        </main>


    </div>


    <script src="admin.js"></script>

</body>

</html>
