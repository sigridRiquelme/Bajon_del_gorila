<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administración | El Bajón del Gorila</title>
    
    <link rel="stylesheet" href="admin.css"> 
</head>


<body>

    <div class="admin-container">


        <!-- MENÚ LATERAL -->
        <aside class="sidebar">

            <div class="logo-admin">

                <img src="../img/logo-bajon.png" alt="El Bajón del Gorila">

            </div>


            <div class="admin-label">
                PANEL DE ADMIN
            </div>


            <nav class="menu-admin">

                <a href="#" class="active">
                    Productos
                </a>

                <a href="pedidos.html">
                    Pedidos
                </a>

                <a href="usuarios.html">
                    Usuarios
                </a>

            </nav>


            <div class="admin-info">

                <strong>Administrador</strong>

                <span>admin@gorila.cl</span>

                <a href="#" class="volver-sitio">
                    Volver al sitio
                </a>

            </div>

        </aside>



        <!-- CONTENIDO PRINCIPAL -->
        <main class="contenido-admin">

            <header class="encabezado-productos">

                <div>
                    <h1>PRODUCTOS</h1>
                    <p id="contadorProductos">0 productos</p>
                </div>


                

            </header>
            
            <section class="filtros-productos">

                <input
                    type="text"
                    id="buscarProducto"
                    placeholder="Buscar por nombre..."
                >

                <select id="filtroCategoria">

                    <option value="todas">Todas las categorías</option>
                    <option value="hamburguesas">Hamburguesas</option>
                    <option value="completos">Completos</option>
                    <option value="churrascos">Churrascos</option>
                    <option value="papas">Papas</option>
                    <option value="combos">Combos</option>
                    <option value="bebidas">Bebidas</option>
                    <option value="otros">Otros</option>

                </select>

            </section>

            <section class="tabla-productos">

                <table>

                    <thead>

                        <tr>
                            <th>IMAGEN</th>
                            <th>NOMBRE</th>
                            <th>CATEGORÍA</th>
                            <th>PRECIO</th>
                            <th>STOCK</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>

                    </thead>

                    <tbody id="listaProductos">
                        
                    </tbody>

                </table>

            </section>

            <div class="contenedor-btn-agregar">
                <button class="btn-agregar" id="btnAgregarProducto">
                    + AGREGAR PRODUCTO
                </button>

            </div>

        </main>


    </div>

    <div class="modal-producto" id="modalProducto">

    <div class="modal-contenido">

        <div class="modal-header">

            <h2>AGREGAR PRODUCTO</h2>

            <button class="btn-cerrar-modal" id="cerrarModal">
                ×
            </button>

        </div>


        <form id="formProducto" >

            <div class="campo-formulario">

                <label for="nombreProducto">
                    Nombre del producto
                </label>

                <input
                    type="text"
                    id="nombreProducto"
                    placeholder="Ej: Hamburguesa Gorila"
                    required
                    minlength="3"
                    maxlength="50"
                >

            </div>


            <div class="campo-formulario">

                <label for="descripcionProducto">
                    Descripción
                </label>

                <textarea
                    id="descripcionProducto"
                    placeholder="Descripcion"
                    required
                    maxlength="200"
                ></textarea>

            </div>


            <div class="fila-formulario">

                <div class="campo-formulario">

                    <label for="precioProducto">
                        Precio
                    </label>

                    <input
                        type="number"
                        id="precioProducto"
                        placeholder="8990"
                        required
                        min="1"
                    >

                </div>


                <div class="campo-formulario">

                    <label for="stockProducto">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stockProducto"
                        placeholder="15"
                        required
                        min="0"
                    >

                </div>

            </div>


            <div class="fila-formulario">

                <div class="campo-formulario">

                    <label for="categoriaProducto">
                        Categoría
                    </label>

                    <select id="categoriaProducto">

                        <option value="Hamburguesas">
                            Hamburguesas
                        </option>

                        <option value="Completos">
                            Completos
                        </option>

                        <option value="Churrascos">
                            Churrascos
                        </option>

                        <option value="Papas">
                            Papas fritas
                        </option>

                        <option value="Bebidas">
                            Bebidas
                        </option>

                        <option value="Combos">
                            Combos
                        </option>

                        <option value="Otros">
                            Otros
                        </option>

                    </select>

                </div>


                <div class="campo-formulario">

                    <label for="estadoProducto">
                        Estado
                    </label>

                    <select id="estadoProducto">

                        <option value="Disponible">
                            Disponible
                        </option>

                        <option value="Sin stock">
                            Sin stock
                        </option>

                        <option value="Oculto">
                            Oculto
                        </option>

                    </select>

                </div>

            </div>


            <div class="campo-formulario">

                <label for="imagenProducto">
                    Imagen del producto
                </label>

                <input
                    type="file"
                    id="imagenProducto"
                    accept="image/png, image/jpeg, image/webp"
                    required
                >

            </div>


            <div class="acciones-formulario">

                <button type="submit" class="btn-guardar">
                    GUARDAR PRODUCTO
                </button>

                <button type="button" class="btn-cancelar" id="cancelarModal">
                    CANCELAR
                </button>

            </div>

        </form>

    </div>

</div>

    <script src="admin.js"></script>

</body>

</html>
